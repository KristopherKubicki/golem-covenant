<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">A made thing must be stoppable.</title>
  <desc id="desc">Social preview card for The Golem Covenant.</desc>
  <rect width="1200" height="630" fill="#f7f8fa"/>
  <rect x="54" y="54" width="1092" height="522" rx="28" fill="#ffffff" stroke="#d6dde4" stroke-width="2"/>
  <circle cx="136" cy="132" r="34" fill="none" stroke="#8f1f3d" stroke-width="8"/>
  <text x="136" y="145" text-anchor="middle" fill="#8f1f3d" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700">G</text>
  <text x="194" y="143" fill="#11161d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="31" font-weight="800">golem.md</text>
  <text x="96" y="278" fill="#11161d" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700">A made thing</text>
  <text x="96" y="360" fill="#11161d" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700">must be stoppable.</text>
  <text x="96" y="438" fill="#53606d" font-family="Georgia, 'Times New Roman', serif" font-size="34">A protocol for keeping bots from becoming your unbounded will:</text>
  <text x="96" y="486" fill="#53606d" font-family="Georgia, 'Times New Roman', serif" font-size="34">declare powers, deny defaults, validate limits, test shutdown.</text>
